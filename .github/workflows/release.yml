name: Preparar versão do Tainah

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pacotes:
    name: Montar pacote para ${{ matrix.sistema }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - sistema: Windows
            runner: windows-latest
            sufixo: windows-x64
          - sistema: macOS
            runner: macos-latest
            sufixo: macos-arm64
          - sistema: Linux
            runner: ubuntu-latest
            sufixo: linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Baixar o código desta versão
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compilar, testar e reunir os arquivos
        run: python build.py --output build/package
      - name: Compactar o pacote
        shell: bash
        run: python -c "import shutil; shutil.make_archive('Tainah-${{ matrix.sufixo }}', 'zip', 'build/package')"
      - name: Guardar o pacote para publicação
        uses: actions/upload-artifact@v4
        with:
          name: Tainah-${{ matrix.sufixo }}
          path: Tainah-${{ matrix.sufixo }}.zip

  publicar:
    name: Publicar os downloads da versão
    if: startsWith(github.ref, 'refs/tags/')
    needs: pacotes
    runs-on: ubuntu-latest
    steps:
      - name: Baixar os três pacotes
        uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - name: Criar a página da versão
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notas.md <<'EOF'
          ## Tainah — motor vocal WORLD

          Esta versão inclui o executável de resampling e a biblioteca necessária para usá-lo.
          Há pacotes para Windows x64, Linux x64 e macOS com Apple Silicon.

          ### Instalação

          Extraia o arquivo do seu sistema e mantenha o executável e a biblioteca na mesma
          pasta. No Windows, escolha `Tainah.exe` como resampler no UTAU ou OpenUtau. No
          macOS e Linux, coloque `Tainah` na pasta de resamplers do OpenUtau. O UTAU clássico
          roda no Windows.

          ### O que há no pacote

          - Executável `Tainah` compatível com os argumentos clássicos de resampler.
          - Biblioteca compartilhada WORLD usada pelo executável.
          - Manifesto de expressões para as flags do OpenUtau.
          - Licenças e avisos de autoria.

          O motor entende as flags `g`, `t`, `B` e `H`. Consulte o README para os detalhes.
          EOF
          gh release create "$TAG" downloads/*.zip --title "Tainah $TAG" --notes-file notas.md
