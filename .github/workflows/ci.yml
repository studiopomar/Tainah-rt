name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Construir e testar (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Obter o código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Construir a biblioteca e executar CTest
        run: python build.py
